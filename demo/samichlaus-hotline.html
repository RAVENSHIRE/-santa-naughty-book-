s dem Flughafen-Hauptquartier."],[7.08,8.26,"Wer ist am Apparat?"],[8.94,9.75,"Wie heisst du?"]]},found:{audio:"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130103_def140c3-796f-4e87-b289-700647654421.mp3",text:"Ah, wunderbar! Dich habe ich in meinem goldenen Buch gefunden. Hör gut zu!",cues:[[0,1.16,"Ah, wunderbar!"],[1.78,4.16,"Dich habe ich in meinem goldenen Buch gefunden."],[4.94,5.83,"Hör gut zu!"]]},retry:{audio:"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130103_ec808c72-d061-4202-a774-6de5c23c110e.mp3",text:"Hmm, die Leitung zum Nordpol rauscht ein bisschen. Sag mir bitte nochmals deinen Namen.",cues:[[.74,2.9,"Hmm, die Leitung zum Nordpol rauscht ein bisschen."],[3.62,5.68,"Sag mir bitte nochmals deinen Namen."]]},notfound:{audio:"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130104_aa95cfe5-af8b-4c44-a43f-79f4f6216f1d.mp3",text:"Diesen Namen finde ich nicht in meinem goldenen Buch. Tipp ihn doch einfach unten an.",cues:[[0,2.78,"Diesen Namen finde ich nicht in meinem goldenen Buch."],[3.54,5.18,"Tipp ihn doch einfach unten an."]]},bye:{audio:"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130103_d0cdb3ad-5b35-4303-a978-b691d3d588eb.mp3",text:"Das war deine Geschichte! Wer ruft als Nächstes an? Ho, ho, ho!",cues:[[0,1.36,"Das war deine Geschichte!"],[2.16,3.68,"Wer ruft als Nächstes an?"],[4.3,5.36,"Ho, ho, ho!"]]}},we=JSON.parse('[{"id":"roger","name":"Roger","names":["Roger"],"title":"Der sparsame Superbanker","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130241_78a078e3-4854-4590-80af-e9f83052b10a.mp3","text":"Lieber Roger! Beginnen wir mit einem Mann, der gleich mehrere bemerkenswerte Eigenschaften vereint. Du bist ein ausgezeichneter Banker, verfügst über ein enormes Fachwissen und bist ein absoluter Profi. Das Problem ist nur: Du weisst das leider auch selbst! Dein Selbstvertrauen ist so gross, dass der Samichlaus vermutet, du würdest sogar deinem eigenen Spiegelbild noch Anlageempfehlungen geben. Roger, du bist aber auch ein ausgesprochener Sparfuchs. Der Samichlaus hat gehört, dass du beim Fondue Chinoise die Bouillon zweimal verwendest. Und wenn du beim Wichteln ein Geschenk für 20 Franken kaufen sollst, suchst du zuerst nach einem Rabattcode auf Temu. Seit ungefähr zwei Jahren spielst du leidenschaftlich Padel. Und du bist mächtig stolz auf deine Fortschritte! Das ist auch gut so. Denn der Samichlaus hat gehört, dass du mit Padel nicht nur deine sportliche Karriere vorantreiben, sondern auch deine körperlichen Reserven etwas reduzieren möchtest. Wobei wir ehrlich sein müssen: Dein Fachwissen ist immer noch grösser als dein Kalorienverbrauch! Aber lieber Roger, eines muss man dir lassen: Du bist ein hervorragender Banker, ein wertvoller Kollege und ein Mann mit einer beneidenswerten Ruhe und Selbstvertrauen. Und falls du heute Abend etwas beleidigt bist: Keine Sorge, Roger. Dein Ego wird sich davon schneller erholen als dein Muskelkater nach dem Padel!","cues":[[0,0.9,"Lieber Roger!"],[1.68,6.98,"Beginnen wir mit einem Mann, der gleich mehrere bemerkenswerte Eigenschaften vereint."],[7.9,15.06,"Du bist ein ausgezeichneter Banker, verfügst über ein enormes Fachwissen und bist ein absoluter Profi."],[15.84,16.84,"Das Problem ist nur:"],[17.5,18.98,"Du weisst das leider auch selbst!"],[19.94,28.4,"Dein Selbstvertrauen ist so gross, dass der Samichlaus vermutet, du würdest sogar deinem eigenen Spiegelbild noch Anlageempfehlungen geben."],[28.4,33.4,"Roger, du bist aber auch ein ausgesprochener Sparfuchs."],[34.24,39.34,"Der Samichlaus hat gehört, dass du beim Fondue Chinoise die Bouillon zweimal verwendest."],[40.08,46.96,"Und wenn du beim Wichteln ein Geschenk für 20 Franken kaufen sollst, suchst du zuerst nach einem Rabattcode auf Temu."],[47.78,50.91,"Seit ungefähr zwei Jahren spielst du leidenschaftlich Padel."],[51.12,54.16,"Und du bist mächtig stolz auf deine Fortschritte!"],[54.16,56.08,"Das ist auch gut so."],[56.82,66.5,"Denn der Samichlaus hat gehört, dass du mit Padel nicht nur deine sportliche Karriere vorantreiben, sondern auch deine körperlichen Reserven etwas reduzieren möchtest."],[67.26,68.68,"Wobei wir ehrlich sein müssen:"],[69.46,73,"Dein Fachwissen ist immer noch grösser als dein Kalorienverbrauch!"],[73.68,76.72,"Aber lieber Roger, eines muss man dir lassen:"],[76.72,85.22,"Du bist ein hervorragender Banker, ein wertvoller Kollege und ein Mann mit einer beneidenswerten Ruhe und Selbstvertrauen."],[85.94,88.38,"Und falls du heute Abend etwas beleidigt bist:"],[89.16,90.14,"Keine Sorge, Roger."],[90.92,94.62,"Dein Ego wird sich davon schneller erholen als dein Muskelkater nach dem Padel!"]]},{"id":"sandro","name":"Sandro","names":["Sandro"],"title":"Die UBS-Familiendynastie","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130240_61f2e8a6-17d8-4f1c-a657-897156bca8ae.mp3","text":"Lieber Sandro! Bei dir musste der Samichlaus zuerst einmal überprüfen, ob du überhaupt eine Privatadresse hast. Denn offenbar arbeitet deine gesamte Familie bei der UBS! Deine Frau, deine Kinder und natürlich du selbst. Andere Familien treffen sich am Sonntag zum Mittagessen. Bei euch reicht vermutlich eine Teams-Sitzung! Der Samichlaus fragt sich ernsthaft: Habt ihr eure Kinder eigentlich zu Hause oder im Pausenraum auf der UBS gezeugt? Vielleicht gibt es ja sogar eine interne Kostenstelle dafür! Jedenfalls ist klar: Wenn deine Familie einmal geschlossen kündigen würde, müsste die UBS wahrscheinlich eine Gewinnwarnung herausgeben. Neben deiner UBS-Leidenschaft bist du auch ein begeisterter Fischer. Am liebsten zieht es dich in den hohen Norden. Dort suchst du Ruhe, Einsamkeit und grosse Fische. Wenigstens dort ziehst Du die ganz Grossen an Land. Und neuerdings spielst du auch noch Golf! Sandro, hast du langsam genug vom Banking? Bereitest du dich bereits auf eine zweite Karriere vor? Oder trainierst du einfach schon für den Ruhestand? Beim Golf ist es ja ähnlich wie beim Banking: Man schlägt kräftig zu, hofft auf ein gutes Ergebnis und sucht anschliessend verzweifelt nach dem, was verschwunden ist! Ich bin natürlich etwas misstrauisch geworden, weil du zum Golfspielen offenbar verdächtig häufig nach Málaga fliegst! Sandro, jetzt mal ganz ehrlich: Wieso muss man eigentlich ständig nach Málaga fliegen, um einen kleinen weissen Ball in ein Loch zu schlagen? Golfplätze gibt es schliesslich auch in der Schweiz! Der Samichlaus vermutet deshalb, dass du dort nicht nur an deinem Handicap arbeitest. Vielleicht gibt es in Málaga ja noch ein anderes Handicap, das du vor deiner UBS-Familie geheim halten möchtest? Aber keine Sorge, Sandro. Der Samichlaus schweigt. Zumindest solange, bis deine Frau das nächste Mal nach Málaga mitfliegen möchte! Lieber Sandro, bleib uns erhalten. Denn ohne dich würde die UBS nicht nur einen guten Banker verlieren. Sondern möglicherweise gleich eine ganze Familienabteilung!","cues":[[0,0.96,"Lieber Sandro!"],[1.66,7.56,"Bei dir musste der Samichlaus zuerst einmal überprüfen, ob du überhaupt eine Privatadresse hast."],[8.18,11.58,"Denn offenbar arbeitet deine gesamte Familie bei der UBS!"],[12.46,16.08,"Deine Frau, deine Kinder und natürlich du selbst."],[16.94,19.92,"Andere Familien treffen sich am Sonntag zum Mittagessen."],[20.6,23.12,"Bei euch reicht vermutlich eine Teams-Sitzung!"],[23.8,25.84,"Der Samichlaus fragt sich ernsthaft:"],[26.56,31.56,"Habt ihr eure Kinder eigentlich zu Hause oder im Pausenraum auf der UBS gezeugt?"],[32.22,35.66,"Vielleicht gibt es ja sogar eine interne Kostenstelle dafür!"],[36.46,37.72,"Jedenfalls ist klar:"],[38.46,44.94,"Wenn deine Familie einmal geschlossen kündigen würde, müsste die UBS wahrscheinlich eine Gewinnwarnung herausgeben."],[46,50.06,"Neben deiner UBS-Leidenschaft bist du auch ein begeisterter Fischer."],[51.02,53.42,"Am liebsten zieht es dich in den hohen Norden."],[54,57.76,"Dort suchst du Ruhe, Einsamkeit und grosse Fische."],[58.66,61.48,"Wenigstens dort ziehst Du die ganz Grossen an Land."],[62.08,64.16,"Und neuerdings spielst du auch noch Golf!"],[64.94,67.78,"Sandro, hast du langsam genug vom Banking?"],[68.46,71.14,"Bereitest du dich bereits auf eine zweite Karriere vor?"],[71.98,74.4,"Oder trainierst du einfach schon für den Ruhestand?"],[75.26,85.84,"Beim Golf ist es ja ähnlich wie beim Banking: Man schlägt kräftig zu, hofft auf ein gutes Ergebnis und sucht anschliessend verzweifelt nach dem, was verschwunden ist!"],[86.56,93.22,"Ich bin natürlich etwas misstrauisch geworden, weil du zum Golfspielen offenbar verdächtig häufig nach Málaga fliegst!"],[94.02,96,"Sandro, jetzt mal ganz ehrlich:"],[97,103.04,"Wieso muss man eigentlich ständig nach Málaga fliegen, um einen kleinen weissen Ball in ein Loch zu schlagen?"],[103.94,106.22,"Golfplätze gibt es schliesslich auch in der Schweiz!"],[107.2,111.92,"Der Samichlaus vermutet deshalb, dass du dort nicht nur an deinem Handicap arbeitest."],[112.76,119.24,"Vielleicht gibt es in Málaga ja noch ein anderes Handicap, das du vor deiner UBS-Familie geheim halten möchtest?"],[120.08,121.6,"Aber keine Sorge, Sandro."],[122.22,123.54,"Der Samichlaus schweigt."],[124.34,128.38,"Zumindest solange, bis deine Frau das nächste Mal nach Málaga mitfliegen möchte!"],[129.32,131.78,"Lieber Sandro, bleib uns erhalten."],[132.7,136.42,"Denn ohne dich würde die UBS nicht nur einen guten Banker verlieren."],[136.8,139.9,"Sondern möglicherweise gleich eine ganze Familienabteilung!"]]},{"id":"pavel","name":"Pavel","names":["Pavel","Pawel","Pavle","Pablo"],"title":"Der Aargauer Macho mit Maserati","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130240_9c305a30-4349-4de0-9e25-8f4bdc0f6df0.mp3","text":"Lieber Pavel! Jetzt kommen wir zu einem besonders interessanten Exemplar. Unserem Aargauer! Der Samichlaus hat lange überlegt, ob er dich überhaupt besuchen soll. Denn bekanntlich braucht man für eine Reise in den Aargau drei Dinge: Einen gültigen Pass, starke Nerven und ein Paar weisse Socken! Pavel, du bist ein echter Macho. Ein Mann, wie er im Buche steht. Du liebst schöne Frauen, schnelle Autos und natürlich deinen Maserati. Wobei der Samichlaus gehört hat, dass du über Frauen deutlich mehr Sprüche machst als über Kollegen. Deine Frauensprüche sind teilweise so alt, dass sogar der Samichlaus sagt: «Pavel, diesen Witz habe ich schon erzählt, als Frauen noch keinen Führerschein hatten!» Aber du bist natürlich ein harmloser Macho. Du redest gerne wie ein italienischer Filmstar. Und wenn du dann mit deinem Maserati vorfährst, könnte man tatsächlich glauben, Don Giovanni sei persönlich angekommen. Bis du aus dem Wagen aussteigst und man die weissen Aargauer Socken sieht! Aber Pavel, der Samichlaus hat noch etwas anderes über dich erfahren. Du bist ein absoluter Zahlenmensch! Du liebst Ranglisten, Statistiken, Performancezahlen und natürlich den ersten Platz. Für dich ist der zweite Platz ungefähr so attraktiv wie ein Maserati mit einem Dreizylindermotor! Und da gibt es offenbar einen Kollegen, der dir dieses Jahr besonders schwer im Magen liegt. Unseren Matthias! Der hat nämlich dieses Jahr die besseren Zahlen geliefert. Und seitdem steht er dir gewaltig in der Sonne! Der Samichlaus hat gehört, dass du inzwischen morgens zuerst die UBS-Rangliste kontrollierst, bevor du überhaupt deinen ersten Kaffee trinkst. Und wenn Matthias wieder einen Abschluss macht, steigt bei dir der Blutdruck schneller als die Drehzahl deines Maserati! Aber lieber Pavel, tröste dich: Matthias mag dieses Jahr bei den Zahlen vorne liegen. Dafür hast du den schnelleren Wagen, die schöneren Socken und vermutlich den höheren Benzinverbrauch! Lieber Pavel, wir wissen natürlich alle, dass hinter deiner Machofassade ein sympathischer und liebenswerter Kollege steckt. Aber eines möchte dir der Samichlaus noch mitgeben: Ein Maserati macht aus einem Mann noch keinen Casanova. Und weisse Socken machen die Sache definitiv nicht besser!","cues":[[0,0.9,"Lieber Pavel!"],[1.64,4.64,"Jetzt kommen wir zu einem besonders interessanten Exemplar."],[5.5,6.5,"Unserem Aargauer!"],[7.56,11.08,"Der Samichlaus hat lange überlegt, ob er dich überhaupt besuchen soll."],[11.72,15.28,"Denn bekanntlich braucht man für eine Reise in den Aargau drei Dinge:"],[16.24,20.4,"Einen gültigen Pass, starke Nerven und ein Paar weisse Socken!"],[21.16,23.56,"Pavel, du bist ein echter Macho."],[24.16,25.72,"Ein Mann, wie er im Buche steht."],[26.28,30.72,"Du liebst schöne Frauen, schnelle Autos und natürlich deinen Maserati."],[31.58,37.04,"Wobei der Samichlaus gehört hat, dass du über Frauen deutlich mehr Sprüche machst als über Kollegen."],[38.18,42.7,"Deine Frauensprüche sind teilweise so alt, dass sogar der Samichlaus sagt:"],[43.46,47.92,"«Pavel, diesen Witz habe ich schon erzählt, als Frauen noch keinen Führerschein hatten!»"],[48.9,51.12,"Aber du bist natürlich ein harmloser Macho."],[51.88,54.2,"Du redest gerne wie ein italienischer Filmstar."],[54.69,61.68,"Und wenn du dann mit deinem Maserati vorfährst, könnte man tatsächlich glauben, Don Giovanni sei persönlich angekommen."],[62.25,66.82,"Bis du aus dem Wagen aussteigst und man die weissen Aargauer Socken sieht!"],[67.68,71.86,"Aber Pavel, der Samichlaus hat noch etwas anderes über dich erfahren."],[72.72,74.8,"Du bist ein absoluter Zahlenmensch!"],[75.56,81.08,"Du liebst Ranglisten, Statistiken, Performancezahlen und natürlich den ersten Platz."],[81.74,87.72,"Für dich ist der zweite Platz ungefähr so attraktiv wie ein Maserati mit einem Dreizylindermotor!"],[88.48,93.62,"Und da gibt es offenbar einen Kollegen, der dir dieses Jahr besonders schwer im Magen liegt."],[94.46,95.44,"Unseren Matthias!"],[96.22,98.92,"Der hat nämlich dieses Jahr die besseren Zahlen geliefert."],[99.68,102.02,"Und seitdem steht er dir gewaltig in der Sonne!"],[102.88,111.08,"Der Samichlaus hat gehört, dass du inzwischen morgens zuerst die UBS-Rangliste kontrollierst, bevor du überhaupt deinen ersten Kaffee trinkst."],[111.72,118.12,"Und wenn Matthias wieder einen Abschluss macht, steigt bei dir der Blutdruck schneller als die Drehzahl deines Maserati!"],[119.2,121.2,"Aber lieber Pavel, tröste dich:"],[121.98,124.7,"Matthias mag dieses Jahr bei den Zahlen vorne liegen."],[125.38,131.32,"Dafür hast du den schnelleren Wagen, die schöneren Socken und vermutlich den höheren Benzinverbrauch!"],[132.04,139.58,"Lieber Pavel, wir wissen natürlich alle, dass hinter deiner Machofassade ein sympathischer und liebenswerter Kollege steckt."],[140.42,143.24,"Aber eines möchte dir der Samichlaus noch mitgeben:"],[144.26,147.4,"Ein Maserati macht aus einem Mann noch keinen Casanova."],[147.94,151.32,"Und weisse Socken machen die Sache definitiv nicht besser!"]]},{"id":"simon","name":"Simon","names":["Simon","Simi"],"title":"Der enttarnte Geheimagent auf der Vespa","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130239_ac21129c-709d-438e-8e7f-737df3c5145c.mp3","text":"Lieber Simon! Bei dir hatte der Samichlaus bisher ein echtes Problem. Normalerweise weiss ich über jeden Menschen alles. Aber bei dir? Fast nichts! Du bist offenbar ein Meister der Zurückhaltung. Nur mit viel Mühe und intensiver Recherche ist noch etwas ans Licht gekommen. Hinter der stillen Fassade von Simon steckt ein ehemaliger UBS-Geschäftsstellenleiter! In Regensdorf warst du einmal Chef. Und heute sitzt du im Team Zürich Nord. Simon, was ist da eigentlich passiert? War das eine raffinierte Karriereentscheidung? Schau dir mal diesen Haufen an! Immerhin hast du dich damit für ein erfolgreichste Team entschieden. Ganz dumm kann die Entscheidung also nicht gewesen sein! Und dann wäre da noch deine äussere Erscheinung. Der Samichlaus hat erfahren, dass du früher einen Schnauz getragen hast. Eine sogenannte Schnuderbremse! Wobei die Betonung offenbar auf Bremse lag. Denn besonders vorteilhaft soll das Ding ja nicht gewesen sein! Gut, dass du ihn abrasiert hast. Jetzt sieht man wenigstens wieder, dass Du noch lächelst! Auch privat hat der Samichlaus inzwischen einiges herausgefunden. Du hast eine Partnerin und eine gemeinsame Tochter. Ihr seid beide berufstätig und eure Kleine besucht die Krippe. Das verlangt natürlich einiges an Organisation. Andere Banker schaffen es kaum, ihre Outlook-Termine richtig zu koordinieren. Du organisierst nebenbei noch einen kompletten Familienbetrieb. Und weil das offenbar noch nicht anstrengend genug ist, hast du dir wegen deiner Rückenprobleme auch noch einen Personaltrainer gegönnt. Simon, früher hast du eine ganze UBS-Geschäftsstelle geführt. Heute brauchst du einen Personaltrainer, damit du dich morgens überhaupt noch selber aufrichten kannst! Und in deiner Freizeit fährst du Vespa. Das passt natürlich hervorragend! Andere Männer kaufen sich in der Midlife-Crisis einen Porsche. Simon kauft sich eine Vespa und lässt sich vom Personaltrainer wieder geradebiegen! Aber eines muss man dir lassen: Du bist ruhig, überlegt und verschwendest deine Energie nicht mit unnötigem Geschwätz und ausgedehnten Kaffeepausen. Lieber Simon, der Samichlaus wird dich weiterhin beobachten. Und falls du eines Tages wieder einen Schnauz wachsen lässt, wissen wir wenigstens, dass deine nächste Karrierekrise unmittelbar bevorsteht!","cues":[[0,0.9,"Lieber Simon!"],[1.72,5.02,"Bei dir hatte der Samichlaus bisher ein echtes Problem."],[6.06,8.8,"Normalerweise weiss ich über jeden Menschen alles."],[9.7,10.6,"Aber bei dir?"],[11.18,12.08,"Fast nichts!"],[12.8,15.34,"Du bist offenbar ein Meister der Zurückhaltung."],[16.02,20.7,"Nur mit viel Mühe und intensiver Recherche ist noch etwas ans Licht gekommen."],[21.76,26.34,"Hinter der stillen Fassade von Simon steckt ein ehemaliger UBS-Geschäftsstellenleiter!"],[27.26,30.16,"In Regensdorf warst du einmal Chef."],[30.16,33.18,"Und heute sitzt du im Team Zürich Nord."],[34 ass wir jemanden im Team haben, der nicht nur unser finanzielles, sondern notfalls auch unser körperliches Überleben sicherstellt.","cues":[[0,1.07,"Lieber Nicola!"],[1.74,4.86,"Bei dir weiss der Samichlaus gar nicht, wo er anfangen soll."],[5.48,11.64,"Du bist intelligent, engagiert und offenbar schon seit deiner Geburt mit der UBS verbunden."],[12.66,15.58,"Andere Kinder bekommen nach der Geburt einen Schnuller."],[16.56,20.79,"Nicola, du bekamst vermutlich direkt einen UBS-Mitarbeiterausweis!"],[22.16,26.74,"Und statt Gutenachtgeschichten gab es bei euch wahrscheinlich den Geschäftsbericht."],[26.74,32.24,"Aber neben deiner Leidenschaft fürs Banking hast du noch ein anderes grosses Thema:"],[33.12,34.02,"Gesundheit!"],[35.14,36.04,"Wellbeing!"],[36.48,37.38,"Work-Life-Balance!"],[37.82,44.64,"Du besuchst regelmässig Kurse und beschäftigst dich intensiv damit, wie Menschen gesund und ausgeglichen bleiben."],[45.62,47.26,"Das ist natürlich sehr lobenswert."],[48.02,50.02,"Allerdings fragt sich der Samichlaus:"],[50.78,56.64,"Wie viel Freizeit bleibt eigentlich noch übrig, wenn man ständig Kurse über Work-Life-Balance besucht?"],[57.54,62.5,"Und als wäre das nicht genug, bist du auch noch ausgebildeter Betriebssanitäter."],[63.4,69.26,"Das ist für dieses Team natürlich ein unglaublicher Vorteil und bei so viel Stress ein MUSS!"],[70.02,81.32,"Denn wenn Roger nach dem Padel zusammenbricht, Pavel beim Anblick einer schönen Frau Herzrasen bekommt oder Sandro beim Golf seinen letzten Ball verliert, bist du sofort zur Stelle!"],[82.3,85.5,"Lieber Nicola, ich habe deshalb einen Vorschlag:"],[86.36,90.82,"Beim heutigen Fondue Chinoise setzt du dich am besten direkt neben Roger."],[91.96,97.48,"Falls der beim Dessert seinen Cholesterinspiegel sieht, brauchen wir dich möglicherweise schneller als gedacht!"],[98.64,99.54,"Aber im Ernst:"],[100.12,109.32,"Es ist beruhigend zu wissen, dass wir jemanden im Team haben, der nicht nur unser finanzielles, sondern notfalls auch unser . Aber denk daran: Nächstes Jahr beginnt die Rangliste wieder bei null!","cues":[[0.34,1.24,"Lieber Matthias!"],[1.56,3.84,"Jetzt kommen wir zu einem ganz besonderen Fall."],[4.64,7.22,"Ein Mann, der fast immer gut gelaunt ist."],[7.84,13.84,"Der gerne lacht, gerne Sprüche macht und dafür sorgt, dass es im Team selten langweilig wird."],[14.6,19.32,"Matthias hat ein ausgesprochen gutes Gespür für Menschen und seine Kunden."],[20.32,25.72,"Er versteht es, auf sie einzugehen, ihre Bedürfnisse zu erkennen und Vertrauen aufzubauen."],[26.34,29.12,"Und offenbar funktioniert das hervorragend."],[29.12,33.34,"Denn dieses Jahr hat Matthias die besten Zahlen im Team erreicht!"],[33.83,34.73,"– gell Pavel!"],[35.32,38.04,"Das ist natürlich eine beachtliche Leistung."],[38.54,39.44,"Oder Pavel?"],[40.16,42.28,"Wobei der Samichlaus sich fragt:"],[42.7,46.16,"Liegt das tatsächlich an seinem aussergewöhnlichen Verkaufstalent?"],[46.8,52.48,"Oder lachen die Kunden einfach so lange über seine Witze, bis sie irgendwann alles unterschreiben?"],[53.62,59.76,"Matthias ist jedenfalls ein Meister darin, gute Stimmung und gute Geschäfte miteinander zu verbinden."],[60.68,64.94,"Natürlich könnte man jetzt meinen, dass ihm der Erfolg zu Kopf gestiegen ist."],[65.44,66.5,"Aber das wäre unfair."],[67.42,74.88,"Wobei … wenn man sich Matthias’ Kopf so anschaut, könnte man tatsächlich meinen, der Erfolg sei ihm zu Kopf gestiegen!"],[75.82,80.16,"Die Haare jedenfalls haben offenbar längst kapituliert und das Weite gesucht!"],[81.1,89.38,"Der Samichlaus vermutet, dass Matthias seine Haare nicht verloren hat, sondern dass sie vor lauter Erfolgsdruck freiwillig gekündigt haben."],[90.24,95.34,"Aber Matthias, mach dir nichts draus: Andere Banker haben ein dichtes Haar."],[95.9,98.26,"Du hast dafür eine dichte Kundenpipeline!"],[98.92,106.04,"Denn trotz seiner guten Resultate ist Matthias ein umgänglicher, hilfsbereiter und humorvoller Kollege geblieben."],[106.88,108.76,"Der Samichlaus notiert deshalb:"],[108.76,116.08,"Viel Drive, viel Herz – und auch dann noch ansprechbar, wenn bei allen anderen der Puls hochgeht."],[116.76,117.98,"Und lieber Matthias:"],[118.38,119.28,"Mach weiter so."],[119.96,120.86,"Aber denk daran:"],[121.5,123.9,"Nächstes Jahr beginnt die Rangliste wieder bei null!"]]},{"id":"thomas","name":"Thomas","names":["Thomas","Tomas","Tom","Tommy"],"title":"Der Vielflieger","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130239_5f618f88-e71e-41bf-9440-79b7e456b962.mp3","text":"Lieber Thomas! Du bist für den Samichlaus ein ganz besonders schwieriger Fall. Denn über dein Privatleben weiss man ungefähr so viel wie über die genaue Rezeptur des Appenzeller Käses. Nämlich herzlich wenig! Du bist ein ziemlich geheimnisvoller Zeitgenosse. Aber eines weiss der Samichlaus mit absoluter Sicherheit: Du bist häufiger in der Luft als die meisten Zugvögel! Andere Menschen haben ein Wohnzimmer mit Sofa, Fernseher und gemütlichem Cheminée. Thomas hat einen Airbus! Und während andere am Wochenende gemütlich auf dem Sofa sitzen, fragst du dich vermutlich bereits, wohin du als Nächstes fliegen könntest. Der Samichlaus hat gehört, dass du inzwischen sogar den legendären HON Circle Member Status erreicht hast! Das ist bei der Lufthansa bekanntlich die höchste Stufe für Vielflieger. Thomas, ganz ehrlich: Wie oft muss man eigentlich von zu Hause flüchten, bis einem eine Fluggesellschaft einen solchen Status verleiht? Der Samichlaus vermutet, dass du inzwischen mehr Flugstunden gesammelt hast als so mancher Berufspilot! Lieber Thomas, eines muss man dir lassen: Du bist ein echter Weltenbummler, ein leidenschaftlicher Flieger und wahrscheinlich der einzige Mensch in diesem Team, der beim Wort «Heimat» zuerst an die Swiss Business Lounge denkt! Der Samichlaus hat deshalb nur noch eine einzige Frage: Thomas, wenn du eines Tages in Pension gehst – ziehst du dann eigentlich nach Hause oder gleich definitiv in den Terminal A am Flughafen Zürich? Und jetzt wünsche ich dir für 2027 weiterhin viele schöne Flüge, möglichst wenig Verspätungen und vor allem eines: Dass du irgendwann wieder einmal genügend Zeit findest, um deine eigene Wohnung zu besuchen! Und übrigens… Know Your Customer! Aber bei Dir Thomas müssten wir zuerst einmal einführen: Know Your Colleague! Lieber Thomas, der Samichlaus empfiehlt dir deshalb für 2027 etwas mehr Transparenz. Sonst muss die Compliance-Abteilung tatsächlich noch ein Dossier über dich eröffnen!","cues":[[0,0.9,"Lieber Thomas!"],[1.54,5.1,"Du bist für den Samichlaus ein ganz besonders schwieriger Fall."],[5.8,12.32,"Denn über dein Privatleben weiss man ungefähr so viel wie über die genaue Rezeptur des Appenzeller Käses."],[13.04,14.96,"Nämlich herzlich wenig!"],[15.76,18.26,"Du bist ein ziemlich geheimnisvoller Zeitgenosse."],[18.98,22.04,"Aber eines weiss der Samichlaus mit absoluter Sicherheit:"],[22.9,25.82,"Du bist häufiger in der Luft als die meisten Zugvögel!"],[26.66,32.06,"Andere Menschen haben ein Wohnzimmer mit Sofa, Fernseher und gemütlichem Cheminée."],[32.78,34.16,"Thomas hat einen Airbus!"],[35.04,42.82,"Und während andere am Wochenende gemütlich auf dem Sofa sitzen, fragst du dich vermutlich bereits, wohin du als Nächstes fliegen könntest."],[43.6,50.54,"Der Samichlaus hat gehört, dass du inzwischen sogar den legendären HON Circle Member Status erreicht hast!"],[50.54,55.06,"Das ist bei der Lufthansa bekanntlich die höchste Stufe für Vielflieger."],[55.86,56.92,"Thomas, ganz ehrlich:"],[57.82,63.94,"Wie oft muss man eigentlich von zu Hause flüchten, bis einem eine Fluggesellschaft einen solchen Status verleiht?"],[64.84,70.42,"Der Samichlaus vermutet, dass du inzwischen mehr Flugstunden gesammelt hast als so mancher Berufspilot!"],[71.26,74.12,"Lieber Thomas, eines muss man dir lassen:"],[74.8,85.92,"Du bist ein echter Weltenbummler, ein leidenschaftlicher Flieger und wahrscheinlich der einzige Mensch in diesem Team, der beim Wort «Heimat» zuerst an die Swiss Business Lounge denkt!"],[86.68,89.82,"Der Samichlaus hat deshalb nur noch eine einzige Frage:"],[90.8,101.02,"Thomas, wenn du eines Tages in Pension gehst – ziehst du dann eigentlich nach Hause oder gleich definitiv in den Terminal A am Flughafen Zürich?"],[101.62,110.6,"Und jetzt wünsche ich dir für 2027 weiterhin viele schöne Flüge, möglichst wenig Verspätungen und vor allem eines:"],[111.5,116.46,"Dass du irgendwann wieder einmal genügend Zeit findest, um deine eigene Wohnung zu besuchen!"],[117.02,117.92,"Und übrigens…"],[118.56,119.46,"Know Your Customer!"],[120.3,123.14,"Aber bei Dir Thomas müssten wir zuerst einmal einführen:"],[123.78,124.86,"Know Your Colleague!"],[125.8,132.66,"Lieber Thomas, der Samichlaus empfiehlt dir deshalb für 2027 etwas mehr Transparenz."],[132.66,137.66,"Sonst muss die Compliance-Abteilung tatsächlich noch ein Dossier über dich eröffnen!"]]},{"id":"diego","name":"Diego","names":["Diego"],"title":"Der Chef, der seinen Chefposten verloren hat","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130652_c2327a01-ea35-4dea-b8ef-3277a1bc80e7.mp3","text":"Und nun kommen wir zum Höhepunkt des heutigen Abends. Zu unserem Chef! Lieber Diego! Du bist der Zweitjüngste im Team. Intelligent, sympathisch, kompetent und offenbar bei allen beliebt. Der Samichlaus hat wirklich intensiv nach deinen Schwächen gesucht und bis auf eine Sache nichts gefunden! Dazu komme ich aber später. Das ist natürlich höchst verdächtig. Entweder bist du tatsächlich so perfekt … Oder du hast deine Personalakte bei der UBS so gründlich bereinigt, dass selbst die Compliance nichts mehr findet! Aber eines ist sicher: Wer in so jungen Jahren bereits Chef von diesem Haufen geworden ist, muss entweder aussergewöhnlich talentiert sein … Oder beim Stellenentscheid ist damals etwas gewaltig schiefgelaufen! Sportlich warst du jedenfalls schon immer! Als talentierter Innenverteidiger beim FC Seuzach in der 2. Liga warst du mit deiner Körpergrösse eine gefürchtete Waffe in der Defensive. Die gegnerischen Stürmer hatten vermutlich mehr Angst vor dir als unsere Kunden vor einer negativen Börsenperformance! Und man sieht dir noch heute an, dass du ein Sportler bist. Tennis, Fahrradfahren und neuerdings sogar Schöppelen gehören zu deinen Freizeitbeschäftigungen. Wobei wir auf das Schöppelen gleich noch zurückkommen. Aber Diego, bei aller Führungsstärke und sportlichen Disziplin: Deine private Agenda hast du offenbar überhaupt nicht im Griff! Deine Sixfull-Buebe würden nämlich liebend gerne wieder einmal mit dir nach Ibiza reisen. Aber einen gemeinsamen Termin mit dir zu finden, ist inzwischen schwieriger als eine Privataudienz beim Papst! Die Jungs fragen sich wahrscheinlich schon, ob sie für einen Termin bei dir zuerst ein Mandat abschliessen müssen. Diego, jetzt mal im Ernst: Dein iPhone hat doch auch eine Kalenderfunktion! Wobei … wenn man sein Handy auf Ibiza verliert, so wie du damals, nützt natürlich auch der beste Kalender nichts! Doch dieses Jahr hat sich in deinem Leben etwas Entscheidendes verändert. Du bist vor wenigen Tagen Vater einer kleinen Tochter geworden – Solean! Dazu gratuliert dir der Samichlaus von Herzen. Allerdings frage ich mich, ob du dir wirklich bewusst bist, was du da angerichtet hast. Jetzt hast du zu Hause eine neue Chefin, die das Sagen hat. Bei deiner Tochter funktionieren weder Mitarbeitergespräche noch Zielvereinbarungen. Und wenn sie nachts um drei eine Eskalation meldet, hilft dir auch kein Vaterschaftsurlaub mehr! Du wirst bald feststellen: Ein Team von Bankern zu führen, ist ein Kinderspiel. Denn deine neue Chefin wird dich Dinge lehren, die in keinem UBS-Führungsseminar vorkommen. Haushalt, Krisenmanagement und bedingungslose Unterordnung! Früher hast du beim FC Seuzach gegnerische Stürmer gestoppt. Heute versuchst du nachts um drei, den Milchfluss zu organisieren! Lieber Diego, geniesse deine letzten Jahre als vermeintlicher Chef. Denn zu Hause hast du die Führungsposition bereits verloren! Und was deine Sixfull-Buebe betrifft: Die nächste Ibiza-Reise kannst du vorläufig vergessen. Dein neues All-inclusive-Resort heisst Kinderzimmer – mit 24-Stunden-Service und ohne Happy Hour!","cues":[[0,3.34,"Und nun kommen wir zum Höhepunkt des heutigen Abends."],[4.06,4.96,"Zu unserem Chef!"],[6.08,6.98,"Lieber Diego!"],[7.44,8.98,"Du bist der Zweitjüngste im Team."],[9.54,14.4,"Intelligent, sympathisch, kompetent und offenbar bei allen beliebt."],[15.32,21.36,"Der Samichlaus hat wirklich intensiv nach deinen Schwächen gesucht und bis auf eine Sache nichts gefunden!"],[22.38,23.68,"Dazu komme ich aber später."],[24.64,26.44,"Das ist natürlich höchst verdächtig."],[27.16,29.28,"Entweder bist du tatsächlich so perfekt …"],[30,37.14,"Oder du hast deine Personalakte bei der UBS so gründlich bereinigt, dass selbst die Compliance nichts mehr findet!"],[37.92,39.1,"Aber eines ist sicher:"],[40,46.64,"Wer in so jungen Jahren bereits Chef von diesem Haufen geworden ist, muss entweder aussergewöhnlich talentiert sein …"],[47.33,50.98,"Oder beim Stellenentscheid ist damals etwas gewaltig schiefgelaufen!"],[51.76,53.72,"Sportlich warst du jedenfalls schon immer!"],[54.72,62.92,"Als talentierter Innenverteidiger beim FC Seuzach in der 2. Liga warst du mit deiner Körpergrösse eine gefürchtete Waffe in der Defensive."],[63.64,70.41,"Die gegnerischen Stürmer hatten vermutlich mehr Angst vor dir als unsere Kunden vor einer negativen Börsenperformance!"],[71.28,74.52,"Und man sieht dir noch heute an, dass du ein Sportler bist."],[75.22,80.9,"Tennis, Fahrradfahren und neuerdings sogar Schöppelen gehören zu deinen Freizeitbeschäftigungen."],[81.68,84.1,"Wobei wir auf das Schöppelen gleich noch zurückkommen."],[84.96,88.92,"Aber Diego, bei aller Führungsstärke und sportlichen Disziplin:"],[89.55,92.88,"Deine private Agenda hast du offenbar überhaupt nicht im Griff!"],[93.8,99.1,"Deine Sixfull-Buebe würden nämlich liebend gerne wieder einmal mit dir rvice und ohne Happy Hour!"]]}]'),pe={audio:"https://d8j0ntlcm91z4.cloudfront.net/user_3Lp2ZXJTZwN4xeFPGrAjLd5x39F/hf_20261126_130239_bd1358c3-68f9-4754-928d-9b59001910a8.mp3",text:"So, meine lieben UBS-Sünder! Ich habe mein goldenes Buch geschlossen. Und ich muss sagen: Was für ein Team! Wir haben einen Sparfuchs mit einem riesigen Ego. Einen Banker, der gleich seine ganze Familie bei der UBS untergebracht hat. Einen Aargauer Macho mit Maserati und weissen Socken. Einen stillen Geheimnisträger. Einen Gesundheitspapst mit Sanitäterausbildung. Einen charmanten Zahlenkönig. Einen Vielflieger, dessen Privatleben selbst für den Nachrichtendienst ein Rätsel wäre. Und einen jungen Chef, der gerade gelernt hat, dass die wahre Macht nicht im Büro, sondern im Kinderzimmer liegt. Wenn das keine schlagkräftige Truppe ist! Aber halt! Da fehlt noch etwas! Der Samichlaus hat nämlich noch einige weitere Namen in seinem goldenen Buch stehen. Und diese Menschen haben etwas gemeinsam: Sie müssen tagtäglich dafür sorgen, dass die acht zuvor erwähnten Spezialisten nicht vollkommen im Chaos versinken! Es ist die sehr geschätzte ImmoPartnerin «Suzi», der Riskmanager «Gaetano», die BEM «Jenny» und die bezaubernde Assistentin Sandy sowie weitere Wegbegleiter und Fachkräfte. Nennen wir Sie heute einfachheitshalber Assistenten. Ihr Assistenten seid es, die im Hintergrund die Fäden zusammenhaltet. Ihr organisiert, koordiniert, kontrolliert, unterstützt und verzweifelt an den Aufträgen und Pendenzen! Denn während die Kollegen Kundenberater fleissig Geschäfte abschliessen, grosse Reden schwingen und sich gegenseitig ihre Performancezahlen um die Ohren hauen, sorgt Ihr dafür, dass der Laden überhaupt funktioniert und nicht auseinander fliegt! Ohne euch wäre das Team Zürich Nord ungefähr so erfolgreich wie ein Maserati ohne Motor! Ihr haltet den Beratern den Rücken frei. Ihr entlastet, wo immer es geht. Ihr denkt mit, springt ein, löst Probleme und sorgt dafür, dass aus guten Ideen auch tatsächlich gute Resultate werden. Und seien wir ehrlich: Manchmal müsst ihr wahrscheinlich sogar Probleme lösen, von denen die Berater noch gar nicht wissen, dass sie sie selbst verursacht haben! Der Samichlaus hat deshalb eine klare Botschaft: Ihr Assistenten seid keine Nebendarsteller. Ihr seid ein entscheidender Teil dieses Erfolgs! Dank euch ist aus diesem Team eine beinahe unschlagbare Truppe geworden. Und dafür habt ihr ein ganz besonders dickes Lob verdient! Eigentlich sogar einen Extrabonus! Und deshalb hat er heute eine ganz besondere Entscheidung getroffen: Die acht Beraterkollegen werden euch heute Abend eine Runde spendieren! Und Roger … Du brauchst jetzt gar nicht erst nach einem Rabattcode zu suchen! Aber jetzt einmal ganz ohne Spass: Bei allen Macken, Eigenheiten und kleinen Verrücktheiten seid ihr ein grossartiges Team. Jeder bringt seine eigenen Stärken mit. Und genau diese Mischung macht euch aus. Der Samichlaus wünscht euch weiterhin viel Erfolg, Gesundheit und vor allem genügend Humor, um auch 2027 gemeinsam durchzustehen. Und jetzt habe ich nur noch eine letzte Bitte: Lasst uns endlich essen! Denn ich habe gehört, es gibt Fondue Chinoise. Ho, ho, ho! Der Samichlaus wünscht euch eine fröhliche Weihnachtszeit!",cues:[[0,2.14,"So, meine lieben UBS-Sünder!"],[3.04,4.98,"Ich habe mein goldenes Buch geschlossen."],[5.8,6.7,"Und ich muss sagen:"],[7.18,8.1,"Was für ein Team!"],[9.08,11.68,"Wir haben einen Sparfuchs mit einem riesigen Ego."],[12.46,16.48,"Einen Banker, der gleich seine ganze Familie bei der UBS untergebracht hat."],[17.36,20.6,"Einen Aargauer Macho mit Maserati und weissen Socken."],[21.36,23.08,"Einen stillen Geheimnisträger."],[23.96,26.72,"Einen Gesundheitspapst mit Sanitäterausbildung."],[27.64,29.5,"Einen charmanten Zahlenkönig."],[30.28,34.9,"Einen Vielflieger, dessen Privatleben selbst für den Nachrichtendienst ein Rätsel wäre."],[35.56,42.54,"Und einen jungen Chef, der gerade gelernt hat, dass die wahre Macht nicht im Büro, sondern im K   <body data-scene="desk">
    <!-- Bühne im 16:9-Format, füllt das Fenster (wie object-fit: cover) -->
    <div id="stage">
      <img id="deskImg" class="layer desk-only" alt="" />
      <canvas id="deskSnow" class="layer desk-only"></canvas>
      <button id="globe" class="desk-only" aria-label="Schneekugel schütteln">
        <span class="globe-img"></span>
        <canvas id="globeSnow"></canvas>
        <span class="globe-shine"></span>
      </button>
      <video id="introVideo" class="layer intro-only" playsinline preload="auto"></video>
      <video id="idleVideo" class="layer room-only" muted loop playsinline preload="auto"></video>
      <video id="talkVideo" class="layer room-only" muted loop playsinline preload="auto"></video>
    </div>

    <!-- Bedienoberfläche, immer im sichtbaren Bereich -->
    <div id="ui">
      <p id="deskHint" class="hint desk-only">Tippe auf die Schneekugel</p>
      <button id="skipIntro" class="ghost intro-only">Überspringen ›</button>

      <div id="caption" class="caption room-only"></div>

      <div id="callBar" class="call-bar room-only">
        <button id="callBtn" class="call-btn"><span class="phone-ico">📞</span> Samichlaus anrufen</button>
      </div>

      <div id="phone" class="phone-ui room-only" hidden>
        <div class="phone-top">
          <span class="live-dot"></span>
          <span id="phoneState">Samichlaus · Nordpol-HQ</span>
          <span id="phoneTimer">00:00</span>
          <button id="hangupBtn" class="hangup" aria-label="Auflegen">Auflegen</button>
        </div>
        <div id="listen" class="listen" hidden>
          <span class="mic">🎙️</span>
          <span id="listenText">Sag deinen Namen …</span>
        </div>
        <div id="names" class="names" hidden></div>
      </div>

      <div id="help" class="help" hidden>
        <b>Gastgeber-Tasten</b><br />
        1–8 Geschichte direkt · S Schlusswort · Leertaste Pause · Esc zurück zur Kugel · F Vollbild · H Hilfe
      </div>
      <div id="fade" class="fade"></div>
      <div id="loading" class="loading">Der Samichlaus putzt seine Brille …</div>
    </div>
  </body>
</html>
